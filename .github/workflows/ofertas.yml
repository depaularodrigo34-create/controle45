name: Atualiza Ofertas a cada 2h

on:
  schedule:
    - cron: '0 */2 * * *'  # a cada 2 horas UTC
  workflow_dispatch: # permite rodar manualmente no GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g surge
      - run: node meu-hosting/robo-ofertas-2h.cjs
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      - name: Commit ofertas.json
        run: |
          git config user.name "robo-ofertas"
          git config user.email "robo@controle45.com.br"
          git add site-ofertas/ofertas.json app-gastos/index.html || true
          git diff --cached --quiet || (git commit -m "chore: atualiza ofertas em alta [skip ci]" && git push)
      - name: Deploy site-ofertas
        run: surge site-ofertas ofertas.controle45.com.br --token ${{ secrets.SURGE_TOKEN }}
      - name: Deploy app
        run: surge app-gastos controle45-2025.surge.sh --token ${{ secrets.SURGE_TOKEN }}
